<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TizenTivi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>TizenTivi</span></div>
    <div id="playlistName" class="playlist-chip">No playlist</div>
    <div class="top-spacer"></div>
    <button id="searchBtn" class="top-action" data-action="search">SEARCH</button>
    <button id="settingsBtn" class="top-action" data-action="settings">SETTINGS</button>
  </header>

  <main class="layout">
    <aside id="sidebar" class="sidebar"></aside>
    <section class="content">
      <div class="player">
        <video id="video" playsinline preload="none"></video>
        <div id="videoEmpty" class="video-empty">
          <div class="video-icon">▶</div>
          <div id="playerStatus">Choose a channel</div>
          <div id="nowTitle" class="now-title">No channel selected</div>
          <div id="nowProgram" class="now-program">Use the remote to browse your playlist</div>
        </div>
        <div class="player-overlay">
          <div>
            <div id="nowSideTitle" class="player-title">No channel</div>
            <div id="nowSideGroup" class="player-sub">—</div>
          </div>
          <div id="playerBadge" class="player-badge">READY</div>
        </div>
      </div>

      <div class="section-head">
        <div>
          <div id="categoryTitle" class="section-title">All Channels</div>
          <div id="channelCount" class="section-count">0 channels</div>
        </div>
        <div class="remote-help">◀ Sidebar &nbsp; ▲▼ Browse &nbsp; OK Play &nbsp; BACK Menu</div>
      </div>

      <div id="channelGrid" class="channel-grid">
        <div id="gridEmpty" class="empty-state">Add a playlist in Settings</div>
      </div>

      <div id="epgBar" class="epg-bar">
        <div>
          <div id="epgTitle" class="epg-title">EPG</div>
          <div id="epgDesc" class="epg-desc">No programme information</div>
        </div>
        <div id="epgTimes" class="epg-times"></div>
      </div>
    </section>
  </main>
</div>

<div id="modalRoot" class="modal-root hidden"></div>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
